_target_: dataset.alphatruck.AlphaTruckDataset
name: "AlphaTruck_HCFS_Third"

root: /scratch/quattro/datasets/HCFS-third_trail_loop
geo_tiff_path: ${.root}/third_trail_loop.tif

ground_image_resize: [512, 512]
aerial_image_resize: [768, 768]

# --- sampling parameters ---
n_poses: 128
dist_bounds: [5.0, 100.0] # (m)
r_bounds: [-90.0, 90.0] # (deg)
radial_power: 0.3

# --- data augmentation ---
center_jitter: 50.0
scale_bounds: [1.0, 3.0]
rotate_augment: True
color_augment: 1.0
depth_dropout: 0.2

train_scenes:
  - AHG_Speedway
  - Speedway_AHG

val_scenes:
  - Speedway_AHG
