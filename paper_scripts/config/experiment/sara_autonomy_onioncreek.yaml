experiment_name: "SARA_autonomy_onioncreek"

dataset:
  name: ARL_SARA
  geotiff: data/ARL_Jackal/onioncreek_EPSG32614_scale03_121225.tiff
  scenes:
    test:
      - onioncreek_autonomy-01_2026-02-18-13-48-48
      - onioncreek_autonomy-02_2026-02-18-13-55-28
      - onioncreek_autonomy-03_2026-02-18-14-00-40

methods:
  - name: Ground Truth
    base_path: data_raw/ARL_Jackal/extracted
    traj_file: "{scene}/adaptive_lio_aligned_clean.csv"
    format: t_xyr
    color: black
    reference: true

  - name: Wheel Odometry
    base_path: data_raw/ARL_Jackal/extracted
    traj_file: "{scene}/odom_platform.csv"
    format: t_xyz_qxyzw
    color: darkgreen
    odom: true
    frame: enu

  - name: GPS
    base_path: data_raw/ARL_Jackal/extracted
    traj_file: "{scene}/gps.csv"
    format: t_gps
    color: firebrick

  - name: BEV-Patch-PF
    base_path: data_raw/ARL_Jackal/extracted
    traj_file: "{scene}/bev_patch_pf_clean.csv"
    format: t_xyz_qxyzw
    frame: enu
    color: blue

viz:
  alpha: 0.5
  linewidth: 8
  reference_linewidth: 11
  legend:
    show: true
    fontsize: 50
    loc: upper left
