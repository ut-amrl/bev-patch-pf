methods:
  - name: Ground Truth
    color: black
    base_path: data/TartanDrive2
    traj_file: "{scene}/odom.csv"
    format: t_xyr
    frame: enu
    reference: true

  - name: Ours
    color: blue
    base_path: output/pf/TartanDrive2/BEV-Patch-Net/BEV-Patch-Net_e4_3.85
    traj_file: "{scene}/pf_traj.csv"
    format: t_xyr
    frame: enu

  - name: BEVLoc
    color: firebrick
    base_path: /home/dlee/Benchmark/bevloc/results/trajectory
    traj_file: "{scene}.txt"
    format: t_xyr
    frame: ned

  - name: Super Odom
    color: orange
    base_path: data/TartanDrive2
    traj_file: "{scene}/lidar_odom.csv"
    format: t_xyz_qxyzw
    frame: enu
    odom: true

  - name: PyCuVSLAM
    color: darkgreen
    base_path: data/TartanDrive2
    traj_file: "{scene}/pycuvslam.csv"
    format: t_xyz_qxyzw
    frame: cam
    odom: true

viz:
  alpha: 0.5
  legend:
    show: false
    loc: upper right
    fontsize: 35
